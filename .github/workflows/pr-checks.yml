name: pr-checks

on:
  pull_request:

# A new push to the PR supersedes whatever was already running for it.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # No LaTeX step here: the PDFs in public/ are deploy artifacts and nothing
      # imports them, so the build works without them. `npm run build` also runs
      # `tsc -b`, which is why there is no separate typecheck step.
      - name: Build
        run: npm run build
